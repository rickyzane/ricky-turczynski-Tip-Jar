<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef1f7">
<title>Ricky Turczynski — Tip Jar</title>
<style>
  * { box-sizing:border-box; }
  body {
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:-apple-system,BlinkMacSystemFont,...;
    background-image:url("https://rickyzane.github.io/ricky-turczynski-Tip-Jar/tip-jar-collage.PNG");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    background-repeat:no-repeat;
    color:#555;
  }
  .wrap { width:min(680px,100%); padding:46px 20px 42px; text-align:center; }
  h1 { margin:0 0 10px;
  font-size:clamp(32px,8vw,56px);
  color:#fff;
  letter-spacing:-1.5px;
  text-shadow:0 3px 10px rgba(0,0,0,.75);
  font-weight:800; }
  .tag { margin:0 0 30px;
  color:#fff;
  font-size:18px;
  font-weight:600;
  text-shadow:0 2px 8px rgba(0,0,0,.75); }
  .card {
    background:rgba(255,255,255,.78);
  border-radius:30px;
  padding:28px 22px;
  box-shadow:0 14px 40px rgba(0,0,0,.18);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.55);
  }
  .title { font-size:31px; font-weight:800; color:#606060; margin:0 0 22px; }
  .buttons { display:grid; gap:14px; }
  a.button {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    min-height:64px;
    border-radius:20px;
    text-decoration:none;
    color:#fff;
    font-size:20px;
    font-weight:800;
    letter-spacing:.2px;
    box-shadow:0 5px 12px rgba(0,0,0,.20);
    border:1px solid rgba(255,255,255,.20);
    transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
}

a.button:hover {
    transform:translateY(-2px);
    filter:brightness(1.08);
    box-shadow:0 8px 18px rgba(0,0,0,.25);
}

a.button:active {
    transform:translateY(1px) scale(.98);
    box-shadow:0 3px 8px rgba(0,0,0,.20);
  }
  
  .cash { background:#16a34a; }
  .venmo { background:#3d95ce; }
  .paypal { background:#003087; }
  .apple { background:#111; }
  .apple small { font-size:13px; font-weight:500; opacity:.8; }
  .note { margin:20px 4px 0;
  font-size:14px;
  line-height:1.5;
  color:#444;
  font-weight:500; }
  .qr {
    margin-top:22px; padding-top:22px; border-top:1px solid #eee;
  }
  .qr img { width:min(300px,80%); border-radius:18px; }
  .qr p { 
 margin:10px 0 0;
    font-size:13px;
    color:#111;
    font-weight:600; }
  .footer { margin:34px 0 0; font-size:23px; font-weight:800; color:#686868; }
</style>
</head>
<body>
<main class="wrap">
  <h1>Ricky Turczynski</h1>
  <p class="tag">Choose your preferred way to send a tip.</p>

  <section class="card">
    <h2 class="title">💰 Tip Jar</h2>

    <div class="buttons">
      <a class="button cash" href="https://cash.app/$Rickyzane"><span class="icon">💵</span> Cash App</</a>
<a class="button venmo" href="https://venmo.com/u/Ricky-Turczynski"><span class="icon">💙</span> Venmo</a>
<a class="button paypal" href="https://paypal.me/rickyzane"><span class="icon">🅿️</span> PayPal </a>
<a class="button apple" href="sms:8507976284?body=Hey%20Ricky%21%20I%27d%20like%20to%20leave%20you%20a%20tip%20via%20Apple%20Cash.%20%F0%9F%92%B0"></span> Apple Cash </a>
    </div>

    <p class="note">
      Apple Cash uses your phone number because it does not provide a public payment profile link.
    </p>

    <div class="qr" id="paypal">
      <img src="ricky_turczynski_tip_jar_qr.png" alt="Ricky Turczynski Tip Jar QR code">
      <p>Scan to open the Tip Jar</p>
    </div>
  </section>

  <div class="footer">Scan. Pay. Go.</div>
</main>
</body>
</html>
